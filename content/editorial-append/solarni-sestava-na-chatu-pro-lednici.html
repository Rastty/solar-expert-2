<p class="se-note"><strong>Plánujete k lednici větší solární pole?</strong> Pokud zvažujete dva panely po 400 Wp, podívejte se na <a href="/jakou-baterii-a-mppt-k-solarnim-panelum-800w/">výběr baterie, MPPT a systému 12/24 V pro 800 Wp</a>. V průvodci počítáme s celkovou spotřebou a ztrátami měniče; pro 230V lednici nezapomeňte ověřit také rozběhový proud a rezervu na horší počasí.</p>
