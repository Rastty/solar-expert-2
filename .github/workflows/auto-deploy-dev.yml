          paged_headers="$(mktemp)"
          paged_body="$(mktemp)"
          paged_http="$(curl -sSL --max-time 30 \
            -H "Cache-Control: no-cache, no-store, max-age=0" \
            -D "$paged_headers" \
            -o "$paged_body" \
            -w "%{http_code}" \
            "$paged_url")"

