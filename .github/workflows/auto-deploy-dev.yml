                "${base}/${slug}/?tool_schema_probe=${GITHUB_SHA}&attempt=${attempt}" \
                > "${directory}/${slug}.html" || true
            done
            if python3 - "$directory" <<'PY'
          import json
          import pathlib
          import sys
          from html.parser import HTMLParser

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.buf = ''
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == 'script':
                      self.capture = dict(attrs).get('type') == 'application/ld+json'
                      self.buf = ''
              def handle_data(self, data):
                  if self.capture:
                      self.buf += data
              def handle_endtag(self, tag):
                  if tag == 'script' and self.capture:
                      self.scripts.append(self.buf)
                      self.capture = False

          base = pathlib.Path(sys.argv[1])
          tools = ('solarni-sestava-na-chatu', 'vyber-baterii',
                   'mppt-kalkulacka', 'vyber-menice', 'quote-checker')
          for slug in (*tools, 'kolik-stoji-fotovoltaika'):
              p = Scripts()
              p.feed((base / (slug + '.html')).read_text(encoding='utf-8',errors='replace'))
              graphs = []
              for text in p.scripts:
                  try:
                      d = json.loads(text)
                  except (ValueError, TypeError):
                      continue
                  if isinstance(d, dict) and isinstance(d.get('@graph'), list):
                      graphs.append(d['@graph'])
              site_graphs = [nodes for nodes in graphs
                             if any(isinstance(n, dict) and n.get('@type') == 'WebSite'
                                    for n in nodes)]
              if len(site_graphs) != 1:
                  sys.exit('Yoast core site graph missing or duplicated: ' + slug)
              graph = site_graphs[0]
              apps = [n for n in graph if isinstance(n, dict) and
                      'WebApplication' in ([n.get('@type')] if isinstance(n.get('@type'), str)
                                           else (n.get('@type') or []))]
              if slug not in tools:
                  if apps:
                      sys.exit('Editorial article must not be described as software: ' + slug)
                  continue
              if len(apps) != 1:
                  sys.exit('Exactly one WebApplication required in Yoast graph: ' + slug)
              app = apps[0]
              url = 'https://solar-expert.cz/' + slug + '/'
              if (app.get('url') != url or app.get('@id') != url + '#app'
                  or app.get('offers', {}).get('price') != 0
                  or app.get('offers', {}).get('priceCurrency') != 'CZK'
                  or app.get('isAccessibleForFree') is not True
                  or 'aggregateRating' in app or 'review' in app):
                  sys.exit('Invalid application URL, free offer or fabricated ratings: ' + slug)
          print('Live Yoast graph verified: five truthful free WebApplications; no editorial app or duplicate site graph.')
          PY
            then
              verified=1
              break
            fi
            echo "Public Yoast app schema has not converged, attempt $attempt/6."
            sleep 10
          done
          if [ "$verified" != '1' ]; then
            echo '::error::Yoast structured tool descriptions are not correctly published.'
            exit 1
          fi

      - name: Verify honest merchant operator disclosure on all buying tools
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base='https://solar-expert.cz'
          healthy=0
          for attempt in {1..6}; do
            health="$(curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "${base}/wp-json/solar-expert/v1/health?operator_probe=${GITHUB_SHA}&attempt=${attempt}" || true)"
            count="$(jq -r '.affiliate_monetized_merchants // 0' <<<"$health" 2>/dev/null || echo 0)"
            operators="$(jq -r '.affiliate_independent_merchant_operators // 0' <<<"$health" 2>/dev/null || echo 0)"
            if [[ "$count" =~ ^[0-9]+$ && "$operators" =~ ^[0-9]+$ ]] \
               && [ "$count" -ge 3 ] && [ "$operators" -ge 2 ] && [ "$operators" -lt "$count" ]; then
              healthy=1
              break
            fi
            sleep 8
          done
          if [ "$healthy" != 1 ]; then
            echo "::error::Live monetization health does not distinguish distinct approved storefronts from independent operators."
            exit 1
          fi

          # Download fully first: piping curl into grep -q under pipefail
          # can generate a false failure (curl receives SIGPIPE when grep
          # finds a match before the response finishes streaming).
          for slug in solarni-sestava-na-chatu vyber-baterii mppt-kalkulacka vyber-menice; do
            html="$(mktemp)"
            if ! curl -fsSL --max-time 30 -H 'Cache-Control: no-cache, no-store' \
              "${base}/${slug}/?seller_probe=${GITHUB_SHA}" > "$html"; then
              echo "::error::Public tool ${slug} could not be fetched for seller disclosure."
              exit 1
            fi
            if ! grep -Fq 'Battery.cz a Solar-Import.cz provozuje stejná společnost Efteria' "$html"; then
              echo "::error::Missing shared-operator disclosure on public tool ${slug}."
              exit 1
            fi
          done
          echo "Independent retailer honesty verified: ${count} affiliate storefronts but ${operators} legal seller(s), and all four purchase tools disclose shared operation."

