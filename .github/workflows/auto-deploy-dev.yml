name: Auto Deploy Solar Expert Dev

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: solar-expert-dev-auto-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_URL: ${{ secrets.SOLAR_EXPERT_DEPLOY_URL }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Detect deploy configuration
        id: config
        shell: bash
        run: |
          if [ -n "$DEPLOY_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SOLAR_EXPERT_DEPLOY_URL is not configured; auto-deploy skipped."
          fi

      - name: Check out release
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v5

      - name: Verify merge came from a previewed PR
        if: steps.config.outputs.enabled == 'true'
        id: pr
        shell: bash
        run: |
          set -euo pipefail

          pulls_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls"
          pulls="$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$pulls_api")"

          pr_number="$(jq -r '[.[] | select(.base.ref=="dev" and .merged_at!=null)] | first | (.number // empty)' <<<"$pulls")"
          pr_head_sha="$(jq -r '[.[] | select(.base.ref=="dev" and .merged_at!=null)] | first | (.head.sha // empty)' <<<"$pulls")"

          if [ -z "$pr_number" ] || [ -z "$pr_head_sha" ]; then
            echo "::error::No merged pull request into dev is associated with this commit; automatic production deploy blocked."
            exit 1
          fi

          echo "number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_sha=$pr_head_sha" >> "$GITHUB_OUTPUT"
          echo "Resolved merged PR #$pr_number with head $pr_head_sha."

      - name: Wait for merge-commit validation
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs"
          ready=0

          for attempt in {1..36}; do
            json="$(curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api")"

            status="$(jq -r '[.check_runs[] | select(.name=="validate")] | first | (.status // "missing")' <<<"$json")"
            conclusion="$(jq -r '[.check_runs[] | select(.name=="validate")] | first | (.conclusion // "")' <<<"$json")"
            echo "merge validate=${status}/${conclusion:-pending}"

            if [ "$status" = "completed" ] && [ -n "$conclusion" ] && [ "$conclusion" != "success" ]; then
              echo "::error::Validate Solar Expert failed on the dev merge commit; production deploy blocked."
              exit 1
            fi

            if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
              ready=1
              break
            fi

            sleep 10
          done

          if [ "$ready" != "1" ]; then
            echo "::error::Timed out waiting for merge-commit validation; production deploy blocked."
            exit 1
          fi

      - name: Verify PR WordPress preview
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        env:
          PR_HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/check-runs"
          json="$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")"

          preview_status="$(jq -r '[.check_runs[] | select(.name=="preview")] | first | (.status // "missing")' <<<"$json")"
          preview_conclusion="$(jq -r '[.check_runs[] | select(.name=="preview")] | first | (.conclusion // "")' <<<"$json")"

          echo "PR preview=${preview_status}/${preview_conclusion:-missing}"

          if [ "$preview_status" != "completed" ] || [ "$preview_conclusion" != "success" ]; then
            echo "::error::The merged PR does not have a successful WordPress Playground preview; production deploy blocked."
            exit 1
          fi

      - name: Trigger Deployer for Git
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        env:
          DEPLOY_URL_FILE: /tmp/solar-expert-deploy-url
        run: |
          set -euo pipefail
          echo "::add-mask::$DEPLOY_URL"

          # Deployer for Git documents that GitHub's branch ZIP may lag briefly
          # after a push/merge, especially for larger repositories.
          sleep 15

          body_file="$(mktemp)"
          deploy_url_file="$DEPLOY_URL_FILE"

          python - <<'PY'
import html
import os
from urllib.parse import parse_qs, quote, urlsplit

raw = html.unescape(os.environ['DEPLOY_URL'].strip())
parts = urlsplit(raw)
params = parse_qs(parts.query, keep_blank_values=True)
secret = (params.get('secret') or [''])[0]
if not secret:
    raise SystemExit('Push-to-Deploy URL does not contain a secret query parameter')

canonical = (
    'https://solar-expert.cz/wp-json/dfg/v1/package_update'
    '?secret=' + quote(secret, safe='')
    + '&type=theme&package=solar-expert-2'
)
with open(os.environ['DEPLOY_URL_FILE'], 'w', encoding='utf-8') as fh:
    fh.write(canonical)
PY

          http_code="$(curl -sSL --max-time 180 --retry 2 --retry-delay 3 \
            -H "Cache-Control: no-cache, no-store, max-age=0" \
            -H "Pragma: no-cache" \
            -o "$body_file" \
            -w "%{http_code}" \
            "$(cat "$deploy_url_file")")"

          echo "Deployer HTTP status: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "::error::Deployer for Git failed with HTTP $http_code."
            exit 1
          fi

          # Older/current plugin builds may return non-JSON bodies on success.
          # When a JSON contract is present, still honor an explicit success=false.
          if jq -e . >/dev/null 2>&1 <"$body_file"; then
            success="$(jq -r '.success // true' <"$body_file")"
            message="$(jq -r '.message // ""' <"$body_file")"
            package_type="$(jq -r '.package_type // ""' <"$body_file")"
            package_slug="$(jq -r '.package_slug // ""' <"$body_file")"
            echo "Deployer JSON: success=${success} package_type=${package_type:-unknown} package_slug=${package_slug:-unknown} message=${message:-none}"
            if [ "$success" = "false" ]; then
              echo "::error::Deployer for Git rejected the deployment: ${message:-unknown error}"
              exit 1
            fi
          else
            echo "Deployer returned HTTP 200 with a non-JSON body; accepted per plugin documentation."
          fi

      - name: Verify live release and managed-content sync
        if: steps.config.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected="$(awk '/^Version:/ {print $2; exit}' style.css)"
          if [ -z "$expected" ]; then
            echo "::error::Could not read expected theme version from style.css."
            exit 1
          fi

          health_url="https://solar-expert.cz/wp-json/solar-expert/v1/health"
          verified=0

          # Deployer may make the site unreachable for a few seconds while files switch.
          # Treat transport/invalid-JSON failures as transient, but fail fast once a valid
          # health payload explicitly reports managed-content errors.
          sleep 5

          for attempt in {1..36}; do
            probe_url="${health_url}?deploy_probe=${GITHUB_SHA}&attempt=${attempt}&ts=$(date +%s)"
            health="$(curl -fsS --max-time 15 \
              -H "Cache-Control: no-cache, no-store, max-age=0" \
              -H "Pragma: no-cache" \
              "$probe_url" 2>/dev/null || true)"

            if [ -z "$health" ] || ! jq -e . >/dev/null 2>&1 <<<"$health"; then
              echo "Health endpoint temporarily unavailable or returned invalid JSON; retrying (${attempt}/36)."
              sleep 10
              continue
            fi

            status="$(jq -r '.status // empty' <<<"$health")"
            live_version="$(jq -r '.theme_version // empty' <<<"$health")"
            sync_required="$(jq -r '.content_sync_required // true' <<<"$health")"
            sync_errors="$(jq -r '.content_sync_errors // 999' <<<"$health")"

            echo "expected=${expected} live=${live_version:-unknown} sync_required=${sync_required} sync_errors=${sync_errors}"

            if [ "$status" = "ok" ] && [ "$live_version" = "$expected" ] && [ "$sync_required" = "true" ] && [ "$sync_errors" = "0" ]; then
              cron_url="https://solar-expert.cz/wp-cron.php?doing_wp_cron=$(date +%s%N)"
              curl -fsS --max-time 15 "$cron_url" >/dev/null 2>&1 || true
              echo "Release is live but managed content is pending; nudged WP-Cron."
            fi

            if [ "$status" = "ok" ] && [ "$sync_errors" != "0" ] && [ "$sync_errors" != "999" ]; then
              echo "::error::Managed-content sync reported errors."
              exit 1
            fi

            if [ "$status" = "ok" ] && [ "$live_version" = "$expected" ] \
              && [ "$sync_required" = "false" ] && [ "$sync_errors" = "0" ]; then
              verified=1
              break
            fi

            sleep 10
          done

          if [ "$verified" != "1" ]; then
            echo "::error::Production health did not converge to the expected release."
            exit 1
          fi

          echo "Production deploy verified: Solar Expert ${expected} is live and content sync is current."
