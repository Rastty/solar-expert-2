             ! grep -Eiq '<meta[^>]+robots[^>]+noindex|<meta[^>]+noindex[^>]+robots' "$paged_body"; then
            echo "::error::Paginated archive is missing live noindex: $paged_url"
            exit 1
          fi

          echo "Paginated archive noindex OK: $paged_url"

          redirect_count="$(jq -r '.legacy_redirect_count' <<<"$health")"
          echo "Crawler discovery verified: robots + sitemap index + page sitemap + ${#indexable_slugs[@]} managed pages + ${#managed_publish_post_slugs[@]} managed publish posts + ${redirect_count} sitemap-clean 301 redirects + paginated archive noindex."

