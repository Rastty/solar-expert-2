name: Solar Expert guarded editorial WordPress publisher

on:
  pull_request:
    paths:
      - ".github/workflows/solar-editorial-publisher.yml"
      - "scripts/editorial_release.py"
      - "scripts/editorial_credentials_check.py"
      - "tests/test_solar_editorial_release.py"
      - "ops/editorial-release.json"
      - "ops/editorial-manifests/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/solar-editorial-publisher.yml"
      - "scripts/editorial_release.py"
      - "scripts/editorial_credentials_check.py"
      - "ops/editorial-release.json"
      - "ops/editorial-manifests/**"
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solar-editorial-wp-single-writer
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check out pinned main/editorial review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify Python syntax
        run: python -m py_compile scripts/editorial_release.py scripts/editorial_credentials_check.py tests/test_solar_editorial_release.py
      - name: Safe publishing one-write regression (offline; no WP credentials)
        run: python -m unittest discover -s tests -p 'test_solar_editorial_release.py' -v

  one-post-wordpress-publisher:
    needs: offline-contract
    # A scheduled check, manual dispatch or rerun must never replay a possibly-ambiguous POST.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout publisher contract from protected default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require an explicit changed editorial release control (not any maintenance push)
        id: activation
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ || ! "$AFTER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'Invalid push identity: no WordPress publication' >&2
            exit 1
          fi
          git cat-file -e "${BEFORE_SHA}^{commit}"
          changed="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- ops/editorial-release.json)"
          if [[ "$changed" == 'ops/editorial-release.json' ]]; then
            echo 'armed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'armed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Exact Git source, WordPress preflight and private source rollback
        if: steps.activation.outputs.armed == 'true'
        id: prepare
        env:
          SOLAR_WP_USER: ${{ secrets.SOLAR_WP_USER }}
          SOLAR_WP_APP_PASSWORD: ${{ secrets.SOLAR_WP_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/editorial_release.py --prepare
      - name: Archive PREWRITE WordPress snapshot before the only possible POST
        if: steps.prepare.outputs.status == 'prepared'
        uses: actions/upload-artifact@v4
        with:
          name: solar-editorial-private-prewrite-${{ github.run_id }}
          path: artifacts/editorial-prewrite-private.json
          if-no-files-found: error
          retention-days: 30
      - name: ONE guarded WordPress REST write, never retry POST
        if: steps.prepare.outputs.status == 'prepared'
        env:
          SOLAR_WP_USER: ${{ secrets.SOLAR_WP_USER }}
          SOLAR_WP_APP_PASSWORD: ${{ secrets.SOLAR_WP_APP_PASSWORD }}
          SOLAR_EDITORIAL_LIVE: "YES"
        run: python scripts/editorial_release.py --apply
      - name: Persist execution receipt including blocks and ambiguous results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-editorial-public-safe-receipt-${{ github.run_id }}
          path: artifacts/editorial-release-receipt.json
          if-no-files-found: warn
          retention-days: 30

  credentials-readonly:
    needs: offline-contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout read-only credential checker
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prove WordPress application password and editor capabilities using GET only
        env:
          SOLAR_WP_USER: ${{ secrets.SOLAR_WP_USER }}
          SOLAR_WP_APP_PASSWORD: ${{ secrets.SOLAR_WP_APP_PASSWORD }}
        run: python scripts/editorial_credentials_check.py
