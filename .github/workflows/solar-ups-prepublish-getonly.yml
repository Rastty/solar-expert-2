name: Solar UPS rev25 publish eligibility - independent WordPress GET-only
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/solar_ups_post_getonly_eligibility.py'
      - '.github/workflows/solar-ups-prepublish-getonly.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/solar_ups_post_getonly_eligibility.py'
      - '.github/workflows/solar-ups-prepublish-getonly.yml'
permissions:
  contents: read
concurrency:
  group: solar-editorial-wp-single-writer
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source syntax and prohibit any mutation in independent proof
        run: |
          python -m py_compile scripts/solar_ups_post_getonly_eligibility.py
          ! grep -E -q 'e\.wp\(.POST.|e\.apply\(|e\.prepare\(' scripts/solar_ups_post_getonly_eligibility.py
      - name: Verify immutable source and LIVE WordPress slug, category, public 404, global UTC 24h
        env:
          SOLAR_WP_USER: ${{ secrets.SOLAR_WP_USER }}
          SOLAR_WP_APP_PASSWORD: ${{ secrets.SOLAR_WP_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m scripts.solar_ups_post_getonly_eligibility
      - name: Receipt: success must be fully evidenced, no future release or WP write claimed
        run: |
          jq -e '
            .status=="eligible"
            and .source_sha256=="6013b235a696ebf7b5524db5f837864a3fd5680ba32cedd9d52636ed2d2ceee7"
            and .current_main_revision==24
            and .next_reviewed_revision==25
            and .publication_window_eligible==true
            and .current_wp_article_absent==true
            and .current_wp_page_slug_absent==true
            and .current_public_status==404
            and .fresh_wp_cooldown_proved==true
            and .wordpress_posts_written==0
            and .publisher_pr_merged==false
          ' artifacts/solar-ups-publish-readonly-eligibility.json > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solar-ups-publish-getonly-eligibility-${{ github.run_id }}
          path: artifacts/solar-ups-publish-readonly-eligibility.json
          retention-days: 14
          if-no-files-found: warn
