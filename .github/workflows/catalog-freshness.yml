name: Solar Expert Catalog Price Freshness Watch

on:
  pull_request:
    branches: [dev]
    paths:
      - "tools/catalog-freshness.mjs"
      - "tests/catalog-freshness.test.mjs"
      - ".github/workflows/catalog-freshness.yml"
      - "data/product-seed.json"
      - "assets/data/product-seed.json"
  push:
    branches: [dev]
    paths:
      - "tools/catalog-freshness.mjs"
      - "tests/catalog-freshness.test.mjs"
      - ".github/workflows/catalog-freshness.yml"
      - "data/product-seed.json"
      - "assets/data/product-seed.json"
  workflow_dispatch:
  # GitHub cron only loads workflow YAML from the repo DEFAULT branch (main).
  # After independently reviewed adoption on main, checkout dev below so the
  # canonical production catalog (not old main release candidate) is inspected.
  schedule:
    - cron: '19 5 * * *'

permissions:
  contents: read

concurrency:
  group: solar-expert-catalog-freshness-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout effective catalog source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove monitor behavior (no network and no merchant writes)
        run: |
          node --check tools/catalog-freshness.mjs
          node --test tests/catalog-freshness.test.mjs
      - name: Review every exact seller price-evidence date, including bundles
        run: node tools/catalog-freshness.mjs
      - name: Upload dated re-verification queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-catalog-freshness-${{ github.run_id }}
          path: artifacts/catalog-freshness.json
          if-no-files-found: warn
          retention-days: 30
