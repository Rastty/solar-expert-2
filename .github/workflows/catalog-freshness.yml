name: Solar Expert Catalog Price Freshness Watch

on:
  pull_request:
    branches: [dev]
    paths:
      - "tools/catalog-freshness.mjs"
      - "tests/catalog-freshness.test.mjs"
      - ".github/workflows/catalog-freshness.yml"
      - "data/product-seed.json"
      - "assets/data/product-seed.json"
  push:
    branches: [dev, main]
    paths:
      - "tools/catalog-freshness.mjs"
      - "tests/catalog-freshness.test.mjs"
      - ".github/workflows/catalog-freshness.yml"
      - "data/product-seed.json"
      - "assets/data/product-seed.json"
  workflow_dispatch:
  # GitHub cron only loads workflow YAML from the repo DEFAULT branch (main).
  # After independently reviewed adoption on main, checkout dev below so the
  # canonical production catalog (not old main release candidate) is inspected.
  schedule:
    - cron: '19 5 * * *'

permissions:
  contents: read

concurrency:
  group: solar-expert-catalog-freshness-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout effective catalog source
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main') && 'dev' || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prove monitor behavior (no network and no merchant writes)
        run: |
          node --check tools/catalog-freshness.mjs
          node --test tests/catalog-freshness.test.mjs
      - name: Review every exact seller price-evidence date, including bundles
        run: node tools/catalog-freshness.mjs
      - name: Audit public live theme byte hashes against dev HEAD (GET only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          dev_sha="$(git rev-parse HEAD)"
          live_base="https://solar-expert.cz/wp-content/themes/solar-expert-2"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          : > "$tmpdir/rows.jsonl"
          for relative in style.css assets/js/selectors.js assets/js/affiliate-adapter.js assets/data/product-seed.json; do
            test -s "$relative"
            dev_hash="$(sha256sum "$relative" | awk '{print $1}')"
            live_hash=""
            state="unavailable"
            # These four files are public theme assets. No WP credentials,
            # POST, theme sync, Deployer call, or backup evidence is used.
            if curl --fail --silent --show-error --max-redirs 0 --connect-timeout 10 \
              --max-time 25 -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Accept-Encoding: identity' \
              -H 'User-Agent: SolarExpert-GitHub-ReadOnly-ThemeAudit/1' \
              "$live_base/$relative?read_only_theme_audit=$dev_sha" \
              -o "$tmpdir/live" && test -s "$tmpdir/live"; then
              live_hash="$(sha256sum "$tmpdir/live" | awk '{print $1}')"
              if [[ "$dev_hash" == "$live_hash" ]]; then state="match"; else state="drift"; fi
            fi
            jq -cn --arg path "$relative" --arg dev_sha256 "$dev_hash" \
              --arg live_sha256 "$live_hash" --arg status "$state" \
              '{path:$path,dev_sha256:$dev_sha256,live_sha256:(if ($live_sha256|length)>0 then $live_sha256 else null end),status:$status}' \
              >> "$tmpdir/rows.jsonl"
            rm -f "$tmpdir/live"
          done
          jq -s --arg dev_sha "$dev_sha" --arg observed_at_utc "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" '
            . as $files | {
              observed_at_utc:$observed_at_utc,
              dev_source_sha:$dev_sha,
              measurement:"read_only_public_theme_source_hashes_not_a_release_or_backup",
              release_authorized:false,
              files:$files,
              four_file_byte_parity:(($files|length)==4 and ($files|all(.[]; .status=="match")))
            }
          ' "$tmpdir/rows.jsonl" > artifacts/solar-live-vs-dev-theme-sources.json
          jq -e '(.files|length)==4 and (.files|all(.[]; (.status=="match" or .status=="drift" or .status=="unavailable")))' \
            artifacts/solar-live-vs-dev-theme-sources.json >/dev/null
          {
            echo '## Solar Expert: public live theme bytes vs current dev HEAD'
            echo ''
            echo '| Public theme file | Live vs dev |'
            echo '|---|---|'
            jq -r '.files[] | "| "+.path+" | "+.status+" |"' artifacts/solar-live-vs-dev-theme-sources.json
            echo ''
            echo 'This check cannot authorize a release or prove a DB/uploads restore. Source differences must be assessed against a separately evidenced live rollback baseline.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$(jq -r '.four_file_byte_parity' artifacts/solar-live-vs-dev-theme-sources.json)" != "true" ]]; then
            echo '::warning::Live Solar Expert theme differs from dev source or could not be read. Do NOT force deploy; a verified live baseline and host restore are still required.'
          fi
      - name: Read public production health and compare real price-evidence freshness to dev source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test -s artifacts/catalog-freshness.json
          curl --fail --silent --show-error --retry 1 --retry-delay 2 --max-time 25 \
            -H 'Accept: application/json' \
            -H 'User-Agent: SolarExpert-GitHub-ReadOnly-CatalogWatch/1' \
            'https://solar-expert.cz/wp-json/solar-expert/v1/health' \
            -o artifacts/solar-production-health-readonly.json
          jq -e '
            .status == "ok" and
            (.catalog_price_snapshots | type == "number") and
            (.catalog_price_fresh | type == "number") and
            (.catalog_price_stale | type == "number") and
            (.catalog_price_verification_unknown | type == "number") and
            (.catalog_price_snapshots == (.catalog_price_fresh + .catalog_price_stale + .catalog_price_verification_unknown))
          ' artifacts/solar-production-health-readonly.json >/dev/null
          jq -e '.total_offers > 0 and (.counts.fresh | type == "number") and (.counts.stale | type == "number") and (.counts.expiring_soon | type == "number") and (.counts.unknown | type == "number") and (.counts.future_dated | type == "number")' artifacts/catalog-freshness.json >/dev/null
          jq -n --slurpfile source artifacts/catalog-freshness.json --slurpfile live artifacts/solar-production-health-readonly.json '
            ($source[0]) as $s | ($live[0]) as $p |
            {
              checked_at_utc: $s.checked_at_utc,
              measurement: "read_only_catalog_evidence_date_comparison_not_verified_merchant_price",
              source_branch: "dev",
              dev: {total: $s.total_offers, fresh_or_expiring: ($s.counts.fresh + $s.counts.expiring_soon), stale: $s.counts.stale, unknown_or_future: ($s.counts.unknown + $s.counts.future_dated)},
              production: {build_marker: $p.build_marker, total: $p.catalog_price_snapshots, fresh: $p.catalog_price_fresh, stale: $p.catalog_price_stale, unknown: $p.catalog_price_verification_unknown},
              catalog_age_parity: (($s.total_offers == $p.catalog_price_snapshots) and (($s.counts.fresh + $s.counts.expiring_soon) == $p.catalog_price_fresh) and ($s.counts.stale == $p.catalog_price_stale) and (($s.counts.unknown + $s.counts.future_dated) == $p.catalog_price_verification_unknown)),
              buyer_events_7d: {
                semantics: "aggregate_events_not_unique_users_or_commissions",
                exposures: ($p.outcome_scoreboard.days_7.tool_exposures // null),
                activations: ($p.outcome_scoreboard.days_7.tool_activations // null),
                offer_exposures: ($p.outcome_scoreboard.days_7.offer_exposures // null),
                affiliate_clicks: ($p.outcome_scoreboard.days_7.affiliate_clicks // null),
                tool_referrals: ($p.outcome_scoreboard.days_7.tool_referral_clicks // null)
              }
            }
          ' > artifacts/solar-live-vs-dev-catalog.json
          test -s artifacts/solar-live-vs-dev-catalog.json
          rm -f artifacts/solar-production-health-readonly.json
          if [[ "$(jq -r '.catalog_age_parity' artifacts/solar-live-vs-dev-catalog.json)" != 'true' ]]; then
            echo '::warning::Live Solar Expert price-snapshot age differs from verified dev catalog. Theme/data deployment is NOT authorized here; investigate exact source and release gate.'
          fi
          {
            echo '## Solar Expert: real production vs source freshness'
            echo ''
            echo '| Environment | Total offer snapshots | Fresh or expiring | Stale | Unknown |'
            echo '|---|---:|---:|---:|---:|'
            jq -r '"| dev source | \(.dev.total) | \(.dev.fresh_or_expiring) | \(.dev.stale) | \(.dev.unknown_or_future) |", "| LIVE production | \(.production.total) | \(.production.fresh) | \(.production.stale) | \(.production.unknown) |"' artifacts/solar-live-vs-dev-catalog.json
            echo ''
            echo 'These are evidence-age categories, not newly checked merchant prices, confirmed stock, visitor counts, or paid conversions. No WordPress writes or theme deploy.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify actual Starlink Mini article to battery and MPPT journey (GET only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT
          live="https://solar-expert.cz"
          asset="$live/wp-content/themes/solar-expert-2/assets/js/selectors.js"
          request_readonly() {
            local url="$1" target="$2"
            curl --fail --silent --show-error --max-redirs 0 \
              --connect-timeout 10 --max-time 20 \
              -H 'Accept-Encoding: identity' \
              -H 'User-Agent: SolarExpert-ReadOnly-BuyerFunnel-Audit/1' \
              "$url" -o "$target"
          }
          article_ok=false
          battery_ok=false
          mppt_ok=false
          selector_js_ok=false
          if request_readonly "$live/starlink-mini-na-chate-solarni-panel-baterie-mppt/" "$audit_dir/article.html" &&
             test -s "$audit_dir/article.html"; then article_ok=true; fi
          if request_readonly "$live/vyber-baterii/" "$audit_dir/battery.html" &&
             test -s "$audit_dir/battery.html"; then battery_ok=true; fi
          if request_readonly "$live/mppt-kalkulacka/" "$audit_dir/mppt.html" &&
             test -s "$audit_dir/mppt.html"; then mppt_ok=true; fi
          if request_readonly "$asset" "$audit_dir/selectors.js" &&
             test -s "$audit_dir/selectors.js"; then selector_js_ok=true; fi
          present() {
            local file="$1" literal="$2"
            if test -s "$file" && grep -Fq "$literal" "$file"; then
              echo true
            else
              echo false
            fi
          }
          article_battery_link="$(present "$audit_dir/article.html" '/vyber-baterii/')"
          article_mppt_link="$(present "$audit_dir/article.html" '/mppt-kalkulacka/')"
          live_dc_input="$(present "$audit_dir/battery.html" 'id="se-battery-supply-mode"')"
          live_starlink_button="$(present "$audit_dir/battery.html" 'data-se-battery-dc-case="starlinkmini"')"
          live_starlink_js="$(present "$audit_dir/selectors.js" 'starlinkmini:')"
          jq -n \
            --arg observed_at_utc "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --argjson article_ok "$article_ok" \
            --argjson battery_ok "$battery_ok" \
            --argjson mppt_ok "$mppt_ok" \
            --argjson selector_js_ok "$selector_js_ok" \
            --argjson article_battery_link "$article_battery_link" \
            --argjson article_mppt_link "$article_mppt_link" \
            --argjson live_dc_input "$live_dc_input" \
            --argjson live_starlink_button "$live_starlink_button" \
            --argjson live_starlink_js "$live_starlink_js" \
            '{
              observed_at_utc:$observed_at_utc,
              measurement:"public_read_only_buyer_route_and_live_feature_existence_not_user_clicks",
              canonical_article:"https://solar-expert.cz/starlink-mini-na-chate-solarni-panel-baterie-mppt/",
              article_http_ok:$article_ok,
              article_battery_link_present:$article_battery_link,
              article_mppt_link_present:$article_mppt_link,
              battery_selector_http_ok:$battery_ok,
              mppt_tool_http_ok:$mppt_ok,
              live_selectors_js_http_ok:$selector_js_ok,
              live_dc_supply_mode_present:$live_dc_input,
              live_starlink_preset_button_present:$live_starlink_button,
              live_starlink_preset_js_present:$live_starlink_js,
              basic_article_to_tools_available:($article_ok and $battery_ok and $mppt_ok and $article_battery_link and $article_mppt_link),
              starlink_dc_buyer_preset_available:($article_ok and $battery_ok and $selector_js_ok and $article_battery_link and $live_dc_input and $live_starlink_button and $live_starlink_js),
              merchant_clicks_generated:0,
              writes:0,
              publish_authorized:false,
              theme_deploy_authorized:false
            }' > artifacts/solar-live-starlink-buyer-journey.json
          jq -e '.writes==0 and .merchant_clicks_generated==0 and
            .theme_deploy_authorized==false and .publish_authorized==false' \
            artifacts/solar-live-starlink-buyer-journey.json >/dev/null
          {
            echo '## Starlink Mini: live article → battery / MPPT journey'
            echo ''
            echo '| Public check | Observed |'
            echo '|---|---|'
            jq -r '"| Starlink published page HTTP | \(.article_http_ok) |", "| Article links to both tools | \(.article_battery_link_present and .article_mppt_link_present) |", "| Both tool pages HTTP | \(.battery_selector_http_ok and .mppt_tool_http_ok) |", "| Live 24V DC preset fully available | \(.starlink_dc_buyer_preset_available) |"' \
              artifacts/solar-live-starlink-buyer-journey.json
            echo ''
            echo 'READ ONLY: HTTP GET only; this audit cannot certify purchase compatibility, product-stock truth, affiliate click, paid commission, WordPress backup, or theme deployment readiness.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$(jq -r '.basic_article_to_tools_available and .starlink_dc_buyer_preset_available' artifacts/solar-live-starlink-buyer-journey.json)" != 'true' ]]; then
            echo '::warning::The new public Starlink article or its intended live DC selector journey is incomplete/unavailable. Do not infer a user conversion, run fake click tests or bypass theme restore gates.'
          fi
      - name: Upload dated re-verification queue
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solar-catalog-freshness-${{ github.run_id }}
          path: |
            artifacts/catalog-freshness.json
            artifacts/solar-live-vs-dev-catalog.json
            artifacts/solar-live-vs-dev-theme-sources.json
            artifacts/solar-live-starlink-buyer-journey.json
          if-no-files-found: warn
          retention-days: 30
