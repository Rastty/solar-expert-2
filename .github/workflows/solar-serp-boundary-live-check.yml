name: Solar heat-pump SERP live readback (GET only)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/solar-serp-boundary-live-check.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/solar-serp-boundary-live-check.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  live-public-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read production writer run metadata from GitHub API (no credentials shown)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/solar-serp-boundary-release.yml/runs?event=push&per_page=30" |
            jq -r '.workflow_runs[] | select(.head_sha == "d7489d5bd96f9d5aec87010a5011cd82d1dede3e") | "SOLAR_WRITER_RUN id=\(.id) status=\(.status) conclusion=\(.conclusion)"'
      - name: Verify exact public title, meta description and canonical without WordPress credentials
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from scripts.solar_serp_boundary_release import public_head, verify_target, TITLE, DESC, TARGET
          h = public_head()
          print('SOLAR_SERP_PUBLIC title_exact=' + str(h['titles'] == [TITLE]).lower()
                + ' description_exact=' + str(h['descriptions'] == [DESC]).lower()
                + ' canonical_exact=' + str(h['canonicals'] == [TARGET]).lower()
                + ' noindex=' + str(any('noindex' in x.lower() for x in h['robots'])).lower(), flush=True)
          verify_target(h, True)
          print('SOLAR_SERP_BOUNDARY_LIVE status=title_meta_verified canonical=exact noindex=false writes=0 wpvibe=0')
          PY
