name: Solar one in-place SEO title repair (single PUT; no WPVibe)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/solar_serp_boundary_title_repair.py'
      - 'tests/test_solar_serp_title_repair.py'
      - 'ops/solar-serp-title-repair-release.json'
      - '.github/workflows/solar-serp-title-repair.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/solar_serp_boundary_title_repair.py'
      - 'tests/test_solar_serp_title_repair.py'
      - 'ops/solar-serp-title-repair-release.json'
      - '.github/workflows/solar-serp-title-repair.yml'
permissions:
  contents: read
concurrency:
  group: solar-editorial-wp-single-writer
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax and real PHP title filter, one-write no-duplicate mock tests
        run: |
          python -m py_compile scripts/solar_serp_boundary_title_repair.py
          python -m unittest discover -s tests -p 'test_solar_serp_title_repair.py' -v
  one-inplace-title-repair:
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Gate on separate new, exact, single control activation change
        id: activation
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'armed=false' >> "$GITHUB_OUTPUT"
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || exit 0
          [[ "$AFTER" =~ ^[0-9a-f]{40}$ ]] || exit 0
          changed="$(git diff --name-only "$BEFORE" "$AFTER" -- ops/solar-serp-title-repair-release.json)"
          [[ "$changed" == 'ops/solar-serp-title-repair-release.json' ]] || exit 0
          jq -e '. == {"schema_version":1,"enabled":true,"revision":2,"mode":"one_inplace_active_serp_title_repair"}' ops/solar-serp-title-repair-release.json >/dev/null
          echo 'armed=true' >> "$GITHUB_OUTPUT"
      - name: Validate live source identity and exact prior title then ONE existing-snippet PUT
        if: steps.activation.outputs.armed == 'true'
        env:
          SOLAR_WP_USER: ${{ secrets.SOLAR_WP_USER }}
          SOLAR_WP_APP_PASSWORD: ${{ secrets.SOLAR_WP_APP_PASSWORD }}
        run: python -m scripts.solar_serp_boundary_title_repair
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solar-serp-inplace-repair-${{ github.run_id }}
          path: artifacts/solar-serp-title-repair-receipt.json
          retention-days: 21
          if-no-files-found: warn
