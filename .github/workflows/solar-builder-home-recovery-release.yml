name: Solar Builder homepage recovery - exact in-place existing Code Snippet update
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/solar_builder_home_recovery_repair.py'
      - 'tests/test_solar_builder_home_recovery_repair.py'
      - 'ops/solar-builder-home-recovery-release.json'
      - '.github/workflows/solar-builder-home-recovery-release.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/solar_builder_home_recovery_repair.py'
      - 'tests/test_solar_builder_home_recovery_repair.py'
      - 'ops/solar-builder-home-recovery-release.json'
      - '.github/workflows/solar-builder-home-recovery-release.yml'
permissions:
  contents: read
concurrency:
  group: solar-editorial-wp-single-writer
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python, real PHP scope, exact in-place PUT safety
        run: |
          python -m py_compile scripts/solar_builder_home_recovery_repair.py
          python -m unittest discover -s tests -p 'test_solar_builder_home_recovery_repair.py' -v
  one-scope-repair:
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Only exact separately reviewed sole false-to-true activation authorizes one PUT
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'armed=false' >> "$GITHUB_OUTPUT"
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || exit 0
          [[ "$AFTER" =~ ^[0-9a-f]{40}$ ]] || exit 0
          [[ "$(git diff --name-only "$BEFORE" "$AFTER")" == 'ops/solar-builder-home-recovery-release.json' ]] || exit 0
          git show "$BEFORE:ops/solar-builder-home-recovery-release.json" |
            jq -e '. == {"schema_version":1,"enabled":false,"revision":1,"mode":"one_inplace_builder_recovery_homepage_scope"}' >/dev/null
          jq -e '. == {"schema_version":1,"enabled":true,"revision":1,"mode":"one_inplace_builder_recovery_homepage_scope"}' ops/solar-builder-home-recovery-release.json >/dev/null
          echo 'armed=true' >> "$GITHUB_OUTPUT"
      - name: One existing exact snippet PUT and authenticated/public readback (NEVER retry)
        if: steps.gate.outputs.armed == 'true'
        env:
          SOLAR_WP_USER: ${{ secrets.SOLAR_WP_USER }}
          SOLAR_WP_APP_PASSWORD: ${{ secrets.SOLAR_WP_APP_PASSWORD }}
        run: python -m scripts.solar_builder_home_recovery_repair
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solar-builder-home-recovery-receipt-${{ github.run_id }}
          path: artifacts/solar-builder-home-recovery-release.json
          retention-days: 21
          if-no-files-found: warn
