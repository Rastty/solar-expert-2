name: Solar GSC one owner-tag snippet via direct WordPress REST (no WPVibe)

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/solar_gsc_code_snippet_release.py"
      - "tests/test_solar_gsc_code_snippet_release.py"
      - "ops/gsc-snippet-release.json"
      - ".github/workflows/solar-gsc-code-snippet-release.yml"
  push:
    branches: [main]
    paths:
      - "scripts/solar_gsc_code_snippet_release.py"
      - "tests/test_solar_gsc_code_snippet_release.py"
      - "ops/gsc-snippet-release.json"
      - ".github/workflows/solar-gsc-code-snippet-release.yml"
permissions:
  contents: read

concurrency:
  group: solar-editorial-wp-single-writer
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Strict snippet scope/identity and zero unintended writes synthetic tests
        run: |
          python -m py_compile scripts/solar_gsc_code_snippet_release.py
          python -m unittest discover -s tests -p 'test_solar_gsc_code_snippet_release.py' -v

  one-exact-site-owner-snippet:
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require newly changed exact GSC release control; never execute on source merge/rerun
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'armed=false' >> "$GITHUB_OUTPUT"
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || exit 0
          [[ "$AFTER" =~ ^[0-9a-f]{40}$ ]] || exit 0
          changed="$(git diff --name-only "$BEFORE" "$AFTER" -- ops/gsc-snippet-release.json)"
          if [[ "$changed" != 'ops/gsc-snippet-release.json' ]]; then exit 0; fi
          jq -e '. == {"schema_version":1,"enabled":true,"revision":1,"mode":"one_site_owner_gsc_code_snippet"}' ops/gsc-snippet-release.json >/dev/null
          echo 'armed=true' >> "$GITHUB_OUTPUT"
      - name: Read existing public tag, create INACTIVE exact snippet, verify identity, activate once, independently verify public HEAD
        if: steps.gate.outputs.armed == 'true'
        env:
          SOLAR_WP_USER: ${{ secrets.SOLAR_WP_USER }}
          SOLAR_WP_APP_PASSWORD: ${{ secrets.SOLAR_WP_APP_PASSWORD }}
        run: python -m scripts.solar_gsc_code_snippet_release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solar-gsc-snippet-release-safe-receipt-${{ github.run_id }}
          path: artifacts/solar-gsc-snippet-release-receipt.json
          retention-days: 21
          if-no-files-found: warn
