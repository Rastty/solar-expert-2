name: Solar live buyer runtime in real Chromium (zero external clicks, zero analytics writes)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/solar_quote_browser_smoke.mjs'
      - 'scripts/solar_builder_fast_result_smoke.mjs'
      - 'assets/js/builder-fast-result.js'
      - 'scripts/solar_svj_browser_readonly.mjs'
      - '.github/workflows/solar-browser-buyer-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/solar_quote_browser_smoke.mjs'
      - 'scripts/solar_builder_fast_result_smoke.mjs'
      - 'assets/js/builder-fast-result.js'
      - 'scripts/solar_svj_browser_readonly.mjs'
      - '.github/workflows/solar-browser-buyer-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: solar-browser-readonly-${{ github.ref }}
  cancel-in-progress: false
jobs:
  live-buyer-no-write:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Source syntax and no outbound merchant events
        run: |
          node --check scripts/solar_quote_browser_smoke.mjs
          node --check scripts/solar_builder_fast_result_smoke.mjs
          node --check assets/js/builder-fast-result.js
          node --check scripts/solar_svj_browser_readonly.mjs
          ! grep -q "trackOffer(" scripts/solar_quote_browser_smoke.mjs
          ! grep -q "trackBundleDealOffer(" scripts/solar_quote_browser_smoke.mjs
      - name: Prove exact previously armed single-PUT home scope writer finished successfully
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/solar-builder-home-recovery-release.yml/runs?event=push&per_page=50" |
            jq -e '[.workflow_runs[] | select(.head_sha == "b319d355a4ff9f7a18b307a3cd6d8d55f1129dd4") | select(.status=="completed" and .conclusion=="success")] | length == 1' >/dev/null
          echo 'SOLAR_BUILDER_HOME_WRITER status=completed_success exact_main_sha=true'
      - name: Verify one source-locked cottage handoff WordPress PUT finished
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/solar-builder-cottage-handoff-release.yml/runs?event=push&per_page=70" |
            jq -e '[.workflow_runs[] | select(.head_sha == "ef13104f09dc5a33062786dea6202cfad41c821a") | select(.status=="completed" and .conclusion=="success")] | length == 1' >/dev/null
          echo 'SOLAR_COTTAGE_HANDOFF_WRITER main_release_success=true exact_sha=true'
      - name: Verify exact one-shot source-priced 24V model publisher concluded successfully
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/solar-24v-reviewed-model-card-release.yml/runs?event=push&per_page=70" |
            jq -e '[.workflow_runs[] | select(.head_sha == "300e869ce36b6e1a3d11ebd45b5ae609e999e799") | select(.status=="completed" and .conclusion=="success")] | length == 1' >/dev/null
          echo 'SOLAR_24V_MODEL_PUBLISHER status=completed_success exact_main_sha=true'
      - name: Install pinned Chromium test runner
        run: |
          test -f package.json || npm init -y > /dev/null
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser-executed source-pinned catalog and real visible buyer journey
        run: node scripts/solar_quote_browser_smoke.mjs
      - name: Real browser E.ON SVJ lead resolver (no clicks, network POSTs or external visits)
        run: node scripts/solar_svj_browser_readonly.mjs
      - name: Check E.ON SVJ browser-only route evidence and no outbound visits
        run: |
          jq -e '.browser_execution_verified==true
            and .public_page_http_200==true
            and .svj_article_heading_present==true
            and .method=="browser_get_only"
            and .external_requests_delivered==0
            and .wordpress_writes==0
            and .affiliate_navigation_attempts==0
            and .lead_click_events==0
            and .proven_conversion==false
            and .revenue_or_svj_campaign_approval=="unknown"
            and (.route_status|type)=="string"' artifacts/solar-svj-browser-readonly.json > /dev/null
      - name: Custom-appliance one-click result in actual old-theme Chromium without outbound requests
        run: node scripts/solar_builder_fast_result_smoke.mjs
      - name: Validate real custom result and preserved advanced sizing without analytics writes
        run: |
          jq -e '.status=="browser_verified" and .inspected_live_site==true
            and .fast_button_count==1 and .customized_energy_wh==1308
            and .custom_result_rendered==true
            and .advanced_season_path_preserved==true
            and .correct_default_parameters==true
            and .network_writes_delivered==0
            and .wordpress_writes==0
            and .affiliate_link_clicks==0
            and .analytics_events_sent==0
            and .real_revenue_verified==false' artifacts/solar-builder-fast-result-smoke.json > /dev/null
      - name: Check browser proof receipt never generated synthetic attribution
        if: success()
        run: |
          jq -e '.browser_execution_verified == true
            and .status == "browser_verified"
            and .word_press_writes == 0
            and .analytics_events_sent == 0
            and .merchant_requests == 0
            and .affiliate_navigation_attempts == 0
            and (.tools | length) == 4
            and ([.tools[].tool] | sort) == ["battery","builder","cottage_battery","home"]
            and ([.tools[] | select(.tool=="cottage_battery") | .cottage_model_exact] | all(. == true))
            and ([.tools[] | select(.tool=="cottage_battery") | .under_capacity_battery_excluded] | all(. == true))
            and ([.tools[] | select(.tool=="builder" or .tool=="home") | .empty_result_recovery_visible] | all(. == true))
            and ([.tools[] | select(.tool=="home") | .homepage_primary_cta_exercised] | all(. == true))
            and ([.tools[] | select(.tool=="home" or .tool=="builder") | .reviewed_24v_model_visible] | all(. == true))
            and ([.tools[] | select(.tool=="home" or .tool=="builder") | .reviewed_24v_model_seller_links] | all(. == 4))
            and ([.tools[] | select(.tool=="home" or .tool=="builder") | .reviewed_24v_model_exact_price_czk] | all(. == 34109))' artifacts/solar-browser-buyer-runtime.json > /dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solar-browser-buyer-runtime-${{ github.run_id }}
          path: |
            artifacts/solar-browser-buyer-runtime.json
            artifacts/solar-svj-browser-readonly.json
            artifacts/solar-builder-fast-result-smoke.json
          retention-days: 14
          if-no-files-found: warn
