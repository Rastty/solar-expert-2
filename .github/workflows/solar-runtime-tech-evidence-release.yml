name: Solar PV Isc source-backed REST upgrade - one existing Code Snippet PUT
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/solar_runtime_pv_tech_release.py'
      - 'tests/test_solar_runtime_pv_tech_release.py'
      - 'ops/solar-runtime-tech-evidence-release.json'
      - '.github/workflows/solar-runtime-tech-evidence-release.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/solar_runtime_pv_tech_release.py'
      - 'tests/test_solar_runtime_pv_tech_release.py'
      - 'ops/solar-runtime-tech-evidence-release.json'
      - '.github/workflows/solar-runtime-tech-evidence-release.yml'
permissions:
  contents: read
concurrency:
  group: solar-editorial-wp-single-writer
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate source-locked manufacturer evidence and real PHP REST JSON
        run: |
          python -m py_compile scripts/solar_runtime_pv_tech_release.py
          python -m unittest discover -s tests -p 'test_solar_runtime_pv_tech_release.py' -v
          node --test tests/catalog-price-overlay-preflight.test.mjs
  one-pv-evidence-update:
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Guard exact separate false→true control-only activation
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'armed=false' >> "$GITHUB_OUTPUT"
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || exit 0
          [[ "$AFTER" =~ ^[0-9a-f]{40}$ ]] || exit 0
          [[ "$(git diff --name-only "$BEFORE" "$AFTER")" == 'ops/solar-runtime-tech-evidence-release.json' ]] || exit 0
          git show "$BEFORE:ops/solar-runtime-tech-evidence-release.json" |
            jq -e '. == {"schema_version":1,"enabled":false,"revision":1,"mode":"one_inplace_rest_quote_tech_evidence_only"}' >/dev/null
          jq -e '. == {"schema_version":1,"enabled":true,"revision":1,"mode":"one_inplace_rest_quote_tech_evidence_only"}' ops/solar-runtime-tech-evidence-release.json >/dev/null
          echo 'armed=true' >> "$GITHUB_OUTPUT"
      - name: Rebuild immutable original 48-quote public REST payload from seller pins (GET only)
        if: steps.gate.outputs.armed == 'true'
        run: node tools/catalog-price-overlay-preflight.mjs
      - name: One active EXISTING Code Snippet PUT; exact old/new public proof; never retry
        if: steps.gate.outputs.armed == 'true'
        env:
          SOLAR_WP_USER: ${{ secrets.SOLAR_WP_USER }}
          SOLAR_WP_APP_PASSWORD: ${{ secrets.SOLAR_WP_APP_PASSWORD }}
        run: python -m scripts.solar_runtime_pv_tech_release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solar-pv-tech-rest-receipt-${{ github.run_id }}
          path: artifacts/solar-runtime-tech-evidence-release.json
          retention-days: 21
          if-no-files-found: warn
