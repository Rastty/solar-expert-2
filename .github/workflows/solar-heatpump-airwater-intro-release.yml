name: Solar heatpump air-water early qualified E.ON CTA - source-locked reversible WP Snippet

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/solar-heatpump-airwater-intro-release.yml'
      - 'scripts/solar_heatpump_airwater_intro_release.py'
      - 'tests/test_solar_heatpump_airwater_intro_release.py'
      - 'tests/solar-heatpump-intro-context.test.php'
      - 'content/snippets/heatpump-airwater-intro-eon-v1.php'
      - 'ops/solar-heatpump-airwater-intro-release.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/solar-heatpump-airwater-intro-release.yml'
      - 'scripts/solar_heatpump_airwater_intro_release.py'
      - 'tests/test_solar_heatpump_airwater_intro_release.py'
      - 'tests/solar-heatpump-intro-context.test.php'
      - 'content/snippets/heatpump-airwater-intro-eon-v1.php'
      - 'ops/solar-heatpump-airwater-intro-release.json'

permissions:
  contents: read

concurrency:
  group: solar-editorial-wp-single-writer
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run source-lock and WordPress synthetic no-retry contract
        run: |
          python -m py_compile scripts/solar_heatpump_airwater_intro_release.py
          python -m unittest discover -s tests -p 'test_solar_builder_fast_result_release.py' -v
          php -l content/snippets/heatpump-airwater-intro-eon-v1.php
          php tests/solar-heatpump-intro-context.test.php
      - name: WordPress Code Snippets exact PHP source syntax
        run: |
          python - <<'PY'
          from scripts.solar_heatpump_airwater_intro_release import PHP_CODE
          from pathlib import Path
          Path('/tmp/solar-heatpump-airwater-intro.php').write_text('<?php\n'+PHP_CODE)
          PY
          php -l /tmp/solar-heatpump-airwater-intro.php
      - name: Review immutable source identity on draft and activation PRs (no WP writes on PR)
        if: github.event_name == 'pull_request'
        run: |
          jq -e '.schema_version==1 and (.enabled|type)=="boolean"
            and .revision==1 and .mode=="one_reversible_heatpump_airwater_intro_offer"
            and .source_blob_sha1=="c15f73fd1dabb14e3c43c37d13f4318015dfd19b" ' ops/solar-heatpump-airwater-intro-release.json >/dev/null

  one-shot-activate:
    needs: offline-contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Only exactly one independent disarmed-to-armed control change authorizes WP writes
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'armed=false' >> "$GITHUB_OUTPUT"
          [[ "$BEFORE" =~ ^[a-f0-9]{40}$ ]] || exit 0
          [[ "$AFTER" =~ ^[a-f0-9]{40}$ ]] || exit 0
          [[ "$(git diff --name-only "$BEFORE" "$AFTER")" == 'ops/solar-heatpump-airwater-intro-release.json' ]] || exit 0
          [[ "$(git rev-parse "$BEFORE:content/snippets/heatpump-airwater-intro-eon-v1.php")" == 'c15f73fd1dabb14e3c43c37d13f4318015dfd19b' ]] || exit 0
          [[ "$(git rev-parse "$AFTER:content/snippets/heatpump-airwater-intro-eon-v1.php")" == 'c15f73fd1dabb14e3c43c37d13f4318015dfd19b' ]] || exit 0
          git show "$BEFORE:ops/solar-heatpump-airwater-intro-release.json" |
            jq -e '. == {"schema_version":1,"enabled":false,"revision":1,
              "mode":"one_reversible_heatpump_airwater_intro_offer",
              "source_blob_sha1":"c15f73fd1dabb14e3c43c37d13f4318015dfd19b"}' >/dev/null
          jq -e '. == {"schema_version":1,"enabled":true,"revision":1,
            "mode":"one_reversible_heatpump_airwater_intro_offer",
            "source_blob_sha1":"c15f73fd1dabb14e3c43c37d13f4318015dfd19b"}' ops/solar-heatpump-airwater-intro-release.json >/dev/null
          echo 'armed=true' >> "$GITHUB_OUTPUT"
      - name: Exact reversible Code Snippets create + activation, with GET-only before/after, never retry
        if: steps.gate.outputs.armed == 'true'
        env:
          SOLAR_WP_USER: ${{ secrets.SOLAR_WP_USER }}
          SOLAR_WP_APP_PASSWORD: ${{ secrets.SOLAR_WP_APP_PASSWORD }}
        run: python -m scripts.solar_heatpump_airwater_intro_release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solar-heatpump-airwater-intro-receipt-${{ github.run_id }}
          path: artifacts/solar-heatpump-airwater-intro-release.json
          retention-days: 14
          if-no-files-found: warn
