name: Validate Solar Expert
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: solar-expert-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -name '*.php' -not -path './theme/*' -not -path './plugin/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: find assets/js tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Affiliate source link audit fixture
        run: node --test tests/affiliate-source-audit.test.mjs
      - name: Evidence-backed retailer prices, stock and 30-day expiry regression
        run: node --test tests/catalog-refresh-20261107.test.mjs
      - name: Daily 52-offer evidence age monitoring and UTC expiry check
        run: node --test tests/catalog-freshness.test.mjs
      - name: Never publish unverified or future-dated seller prices and stock
        run: node --test tests/offer-evidence-fail-closed.test.mjs
      - name: Completed seller-price audit, exact bundle offers and LiFePO4 charging safety
        run: node --test tests/catalog-completion-20261107.test.mjs
      - name: JSON validity
        run: |
          find assets/data data -name '*.json' -print0 | xargs -0 -n1 jq empty
          jq empty content/manifest.json
      - name: Conditional frontend script loading
        run: php tests/conditional-assets.test.php
      - name: Per-tool outbound attribution
        run: php tests/funnel-attribution.test.php
      - name: Product offer exposure and click placement reporting
        run: php tests/funnel-offer-placements.test.php
      - name: Independent retail operator attribution
        run: php tests/merchant-operators.test.php
      - name: Pending independent retailer activation guard
        run: node --test tests/merchant-candidate-vselektro.test.mjs
      - name: One-click Builder hero attribution
        run: node tests/builder-hero-demo.test.js
      - name: Czech buyer journey copy and tools routes
        run: node tests/czech-buyer-journey.test.js
      - name: Selector one-click examples and real activation QA
        run: node tests/selector-first-use.test.js
      - name: Battery Selector AC energy efficiency and BMS current safety
        run: node tests/battery-selector-safety.test.js
      - name: 400W buyer guide to editable Battery Selector handoff
        run: node tests/battery-article-handoff.test.js
      - name: Camera/router 24h DC sizing and 12V battery buyer safety
        run: node tests/battery-camera-dc-handoff.test.js
      - name: Fridge 850Wh buyer article to editable Builder without fabricated starts
        run: node tests/fridge-article-builder-handoff.test.js
      - name: MPPT panel Isc x parallel strings manufacturer safety and article handoff
        run: node tests/mppt-isc-safety.test.js
      - name: Dual Growatt MPPT tracker and purchase gate for unverified absolute Isc
        run: node tests/growatt-tracker-purchase-gate.test.js
      - name: Actual merchant offer CTA labels, price freshness and tracking
        run: node --test tests/offer-cta-clarity.test.mjs
      - name: Buyer SEO guides claim, intent and indexability validation
        run: node --test tests/buyer-seo-posts.test.mjs
      - name: Existing indexed guides to new buying paths
        run: php tests/buyer-discovery.test.php
      - name: Managed category discovery
        run: php tests/managed-categories.test.php
      - name: Native editorial ownership prevents theme content overwrite
        run: php tests/native-editorial-content-preservation.test.php
      - name: Already live caravan buyer guide source, SEO and tool paths
        run: node --test tests/caravan-native-source-parity.test.mjs
      - name: Curated topic archives (scope, relevance and preservation)
        run: php tests/curated-archives.test.php
      - name: Strict old import sitemap and noindex hygiene
        run: php tests/import-seo-hygiene.test.php
      - name: Yoast decision tool structured data
        run: php tests/tool-schema.test.php
      - name: Engine tests
        run: node tests/engine.test.js
      - name: Explicit theme release gate prevents ordinary dev deploys
        run: node --test tests/theme-deploy-release-gate.test.mjs
      - name: Predeploy live-source parity and encrypted-free rollback artifact
        run: node --test tests/deploy-rollback-evidence.test.mjs
      - name: Release-scoped private WordPress DB and uploads restore attestation
        run: node --test tests/deploy-wordpress-backup-gate.test.mjs
      - name: Repository integrity
        run: node tests/repo-integrity.test.js
      - name: SEO taxonomy deploy Bash syntax and manifest coverage
        run: node tests/deploy-seo-taxonomy-shell.test.js
