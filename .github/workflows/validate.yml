name: Validate Solar Expert
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: solar-expert-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: find . -name '*.php' -not -path './theme/*' -not -path './plugin/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: find assets/js tests -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Affiliate source link audit fixture
        run: node --test tests/affiliate-source-audit.test.mjs
      - name: Evidence-backed retailer prices, stock and 30-day expiry regression
        run: node --test tests/catalog-refresh-20261107.test.mjs
      - name: Independently rechecked Pylontech US5000 stock cannot enter active buyer bundles
        run: node --test tests/catalog-pylontech-stock-20261120.test.mjs
      - name: Seller rechecked POLO-W bundle stock and Victron panel alternate quote
        run: node --test tests/catalog-bundle-panel-20261120.test.mjs
      - name: Daily 52-offer evidence age monitoring and UTC expiry check
        run: node --test tests/catalog-freshness.test.mjs
      - name: Never publish unverified or future-dated seller prices and stock
        run: node --test tests/offer-evidence-fail-closed.test.mjs
      - name: Completed seller-price audit, exact bundle offers and LiFePO4 charging safety
        run: node --test tests/catalog-completion-20261107.test.mjs
      - name: JSON validity
        run: |
          find assets/data data -name '*.json' -print0 | xargs -0 -n1 jq empty
          jq empty content/manifest.json
      - name: Conditional frontend script loading
        run: php tests/conditional-assets.test.php
      - name: Alpine native init must not duplicate REST catalog downloads
        run: node tests/alpine-catalog-single-init.test.js
      - name: Per-tool outbound attribution
        run: php tests/funnel-attribution.test.php
      - name: Product offer exposure and click placement reporting
        run: php tests/funnel-offer-placements.test.php
      - name: Split partner routes from direct and legacy outbound clicks
        run: php tests/funnel-outbound-route.test.php
      - name: Never infer commissions or paid revenue from affiliate clicks
        run: php tests/affiliate-financial-outcomes.test.php
      - name: Count buyer-initiated unbuyable results without inventing lost sales
        run: php tests/buyer-offer-gap.test.php
      - name: Only track real selector and builder offer gaps with deduplication
        run: node tests/buyer-offer-gap.test.js
      - name: Bundle-deal offer exposure and verified per-seller conversion reporting
        run: php tests/funnel-bundle-offers.test.php
      - name: Buyer-visible bundle impressions and once-only event tracking
        run: node tests/bundle-offer-exposure-analytics.test.js
      - name: Independent retail operator attribution
        run: php tests/merchant-operators.test.php
      - name: Pending independent retailer activation guard
        run: node --test tests/merchant-candidate-vselektro.test.mjs
      - name: One-click Builder hero attribution
        run: node tests/builder-hero-demo.test.js
      - name: Real custom Builder calculation without unnecessary season form
        run: node tests/builder-manual-fast-result.test.js
      - name: Distinguish canonical tool self-links from genuine referrals
        run: node tests/tool-referral-selflink.test.js
      - name: Quote Checker result keyboard focus and invalid-input retention
        run: node tests/quote-checker-result-focus.test.js
      - name: Czech buyer journey copy and tools routes
        run: node tests/czech-buyer-journey.test.js
      - name: Selector one-click examples and real activation QA
        run: node tests/selector-first-use.test.js
      - name: Battery Selector AC energy efficiency and BMS current safety
        run: node tests/battery-selector-safety.test.js
      - name: 400W buyer guide to editable Battery Selector handoff
        run: node tests/battery-article-handoff.test.js
      - name: Camera/router 24h DC sizing and 12V battery buyer safety
        run: node tests/battery-camera-dc-handoff.test.js
      - name: Starlink Mini direct-DC buyer handoff regression
        run: node tests/battery-starlink-dc-handoff.test.js
      - name: Fridge 850Wh buyer article to editable Builder without fabricated starts
        run: node tests/fridge-article-builder-handoff.test.js
      - name: MPPT panel Isc x parallel strings manufacturer safety and article handoff
        run: node tests/mppt-isc-safety.test.js
      - name: Builder MPPT manufacturer PV capacity and whole-panel tier fallback
        run: node tests/builder-mppt-manufacturer-capacity.test.js
      - name: Builder transparent 12V to 24V catalog purchase alternative
        run: node tests/builder-catalog-voltage-alternative.test.js
      - name: Builder AC battery autonomy and DC BMS discharge safety parity
        run: node tests/builder-ac-battery-safety.test.js
      - name: Builder battery BMS startup surge cannot be inferred from inverter surge
        run: node tests/builder-bms-surge-safety.test.js
      - name: Builder all-items-one-shop checkout convenience with real seller quotes
        run: node tests/builder-single-shop-checkout.test.js
      - name: Builder capacity shortfall explanation and lossless result revision
        run: node tests/builder-result-recovery.test.js
      - name: Dual Growatt MPPT tracker and purchase gate for unverified absolute Isc
        run: node tests/growatt-tracker-purchase-gate.test.js
      - name: Actual merchant offer CTA labels, price freshness and tracking
        run: node --test tests/offer-cta-clarity.test.mjs
      - name: Multi-unit panel and battery shopping quote honesty
        run: node --test tests/multi-unit-buyer-quote.test.mjs
      - name: Anonymous multi-unit affiliate click intent and historical compatibility
        run: node --test tests/affiliate-intent-units.test.mjs
      - name: Immediate buyer bill checkout links with exact seller quote and fail-closed tracking
        run: node tests/builder-primary-purchase-links.test.js
      - name: Prefer a complete linked buyer list over a priced but unclickable Best Value
        run: node tests/builder-actionable-primary-fallback.test.js
      - name: Safe copyable Builder purchase list with real seller URLs and clipboard fallback
        run: node tests/builder-shopping-list-copy.test.js
      - name: Fail-closed actionable merchant links and honest outbound conversion
        run: node tests/actionable-merchant-outbound.test.js
      - name: Fail-closed E.ON lead links and genuine outbound lead-click signals
        run: node tests/actionable-lead-outbound.test.js
      - name: Source-backed price evidence matches seller buy links
        run: node tests/source-backed-price-trust.test.js
      - name: Builder chooses safe price-complete bundles ahead of unquoted first fit
        run: node tests/bundle-price-ready-selection.test.js
      - name: Builder selects source-priced electrically safe PV panels over unquoted exact fit
        run: node tests/builder-panel-price-ready.test.js
      - name: No double purchase of battery and inverter inside discounted set
        run: node tests/builder-set-checkout-dedup.test.js
      - name: Reconciled price-ready buyer summary even when Best Value has no quote
        run: node tests/builder-buyable-primary-checkout.test.js
      - name: Buyer-visible affiliate prices and stock require exact seller evidence
        run: node tests/affiliate-quote-evidence-parity.test.js
      - name: Evidence source URL belongs to declared approved seller domain
        run: node tests/seller-domain-source-integrity.test.js
      - name: Buyer SEO guides claim, intent and indexability validation
        run: node --test tests/buyer-seo-posts.test.mjs
      - name: First-screen checklist handoff and disclosed E.ON CTA after technical review
        run: node --test tests/fve-buyer-lead-visibility.test.mjs
      - name: Existing indexed guides to new buying paths
        run: php tests/buyer-discovery.test.php
      - name: Managed category discovery
        run: php tests/managed-categories.test.php
      - name: Native editorial ownership prevents theme content overwrite
        run: php tests/native-editorial-content-preservation.test.php
      - name: Fail-closed automatic managed-content sync
        run: php tests/automatic-content-sync-opt-in.test.php
      - name: Already live caravan buyer guide source, SEO and tool paths
        run: node --test tests/caravan-native-source-parity.test.mjs
      - name: Deferred Wi-Fi camera native publisher source SHA and ownership
        run: node --test tests/wifi-camera-source-parity.test.mjs
      - name: Curated topic archives (scope, relevance and preservation)
        run: php tests/curated-archives.test.php
      - name: Strict old import sitemap and noindex hygiene
        run: php tests/import-seo-hygiene.test.php
      - name: Yoast decision tool structured data
        run: php tests/tool-schema.test.php
      - name: Engine tests
        run: node tests/engine.test.js
      - name: Explicit theme release gate prevents ordinary dev deploys
        run: node --test tests/theme-deploy-release-gate.test.mjs
      - name: First-migration content input parity is necessary, never deployment approval
        run: node --test tests/theme-code-only-content-preflight.test.mjs
      - name: Offline first-transition archive preserves old managed WordPress content
        run: node --test tests/build-first-transition-theme.test.mjs
      - name: Predeploy live-source parity and encrypted-free rollback artifact
        run: node --test tests/deploy-rollback-evidence.test.mjs
      - name: Release-scoped private WordPress DB and uploads restore attestation
        run: node --test tests/deploy-wordpress-backup-gate.test.mjs
      - name: Repository integrity
        run: node tests/repo-integrity.test.js
      - name: SEO taxonomy deploy Bash syntax and manifest coverage
        run: node tests/deploy-seo-taxonomy-shell.test.js
