name: Solar GSC verification tag (public GET only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/solar_gsc_verification_check.py'
      - 'tests/test_solar_gsc_verification_check.py'
      - '.github/workflows/solar-gsc-verification-readonly.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/solar_gsc_verification_check.py'
      - 'tests/test_solar_gsc_verification_check.py'
      - '.github/workflows/solar-gsc-verification-readonly.yml'
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test exact tag only inside HTML head
        run: |
          python -m py_compile scripts/solar_gsc_verification_check.py tests/test_solar_gsc_verification_check.py
          python -m unittest discover -s tests -p 'test_solar_gsc_verification_check.py' -v
  live-head:
    needs: contract
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read live homepage HTML only, no WordPress writes
        run: python -m scripts.solar_gsc_verification_check
      - name: Report ownership tag without implying GSC API authorization
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.writes == 0 and .theme_deploy_authorized == false and .schema_version == 1' artifacts/solar-gsc-meta-readonly.json >/dev/null
          {
            echo '## Solar Expert — Google Search Console verification tag'
            jq -r '"Live status: **\(.verification_status)**; matching tags in HEAD: **\(.exact_matching_tags_in_head // "unavailable")**"' artifacts/solar-gsc-meta-readonly.json
            echo 'Tag presence alone is not Google ownership verification or GSC API permission.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$(jq -r '.verified_on_live_html' artifacts/solar-gsc-meta-readonly.json)" != 'true' ]]; then
            echo '::warning::GSC owner meta not present exactly once inside the live homepage head.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: solar-gsc-public-head-${{ github.run_id }}
          path: artifacts/solar-gsc-meta-readonly.json
          retention-days: 14
          if-no-files-found: error
