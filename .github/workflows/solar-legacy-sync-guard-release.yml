name: Solar legacy WordPress content-sync guard (Code Snippets, no WPVibe)
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/solar_legacy_sync_guard_release.py'
      - 'tests/test_solar_legacy_sync_guard_release.py'
      - 'ops/solar-legacy-sync-guard-release.json'
      - '.github/workflows/solar-legacy-sync-guard-release.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/solar_legacy_sync_guard_release.py'
      - 'tests/test_solar_legacy_sync_guard_release.py'
      - 'ops/solar-legacy-sync-guard-release.json'
      - '.github/workflows/solar-legacy-sync-guard-release.yml'
permissions:
  contents: read
concurrency:
  group: solar-editorial-wp-single-writer
  cancel-in-progress: false
jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax and real-PHP exact hook contract
        run: |
          python -m py_compile scripts/solar_legacy_sync_guard_release.py
          python -m unittest discover -s tests -p 'test_solar_legacy_sync_guard_release.py' -v
  one-legacy-guard-release:
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Require separate exact one-shot activation transition
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'armed=false' >> "$GITHUB_OUTPUT"
          [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] || exit 0
          [[ "$AFTER" =~ ^[0-9a-f]{40}$ ]] || exit 0
          changed="$(git diff --name-only "$BEFORE" "$AFTER" -- ops/solar-legacy-sync-guard-release.json)"
          [[ "$changed" == 'ops/solar-legacy-sync-guard-release.json' ]] || exit 0
          jq -e '. == {"schema_version":1,"enabled":true,"revision":1,"mode":"one_old_php_implicit_sync_hook_guard"}' ops/solar-legacy-sync-guard-release.json >/dev/null
          echo 'armed=true' >> "$GITHUB_OUTPUT"
      - name: Create one inactive exact guard; read back, activate, inspect four legacy hooks
        if: steps.gate.outputs.armed == 'true'
        env:
          SOLAR_WP_USER: ${{ secrets.SOLAR_WP_USER }}
          SOLAR_WP_APP_PASSWORD: ${{ secrets.SOLAR_WP_APP_PASSWORD }}
        run: python -m scripts.solar_legacy_sync_guard_release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solar-old-sync-guard-${{ github.run_id }}
          path: artifacts/solar-legacy-sync-guard-release.json
          retention-days: 21
          if-no-files-found: warn
